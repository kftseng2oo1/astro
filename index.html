:root{

  --fire:#d2563a; --earth:#8a7a3a; --air:#3f8aa8; --water:#3a5fb8;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1224; --paper:#181c33; --ink:#e7e9f5; --muted:#9aa0bf; --line:#2c3255;
  --night:#9fb0ff; --blood:#ef6b7d; --gold:#e1b65a; --soft:#22274a;

.wrap{max-width:1040px;margin:0 auto;display:grid;gap:20px}
header h1{font-family:var(--display);font-weight:900;font-size:clamp(28px,6vw,40px);margin:0;letter-spacing:.06em;line-height:1.2}
header h1 span{color:var(--blood)}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
.cols{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:16px;min-width:0}
.lbl{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.field{display:grid;gap:8px}
input[type=date],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.signs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.signs button,.bloods button{font:inherit;cursor:pointer;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 2px;display:grid;justify-items:center;line-height:1.2}
.signs button b{font-family:var(--display);font-size:20px;font-weight:500}
.signs button small{font-size:11px;color:var(--muted)}
.signs button[aria-pressed=true]{background:var(--night);color:var(--paper);border-color:var(--night)}
.signs button[aria-pressed=true] small{color:var(--paper);opacity:.8}
.bloods{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bloods button{padding:10px 0;font-family:var(--display);font-weight:700;font-size:18px}
.bloods button[aria-pressed=true]{background:var(--blood);color:#fff;border-color:var(--blood)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hint{font-size:12px;color:var(--muted);margin:0}

.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:22px;background:var(--soft);border-bottom:1px solid var(--line)}
.seal{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;position:relative;border:2px solid var(--night);color:var(--night)}
.seal b{font-family:var(--display);font-size:44px;font-weight:500;line-height:1}
.seal i{position:absolute;right:-6px;bottom:-6px;font-style:normal;background:var(--blood);color:#fff;font-family:var(--display);font-weight:900;font-size:15px;min-width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--soft)}
.hero h2{font-family:var(--display);font-size:clamp(22px,4.6vw,30px);margin:0;line-height:1.3;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--muted)}
.chip.el{color:#fff;border-color:transparent}
.body{padding:22px;display:grid;gap:22px}
.lead{font-size:16px;margin:0;max-width:62ch}
.kws{display:flex;flex-wrap:wrap;gap:6px}
.kws span{font-family:var(--display);font-weight:700;padding:3px 12px;border-radius:6px;background:var(--soft);color:var(--night)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.sec h3{font-family:var(--display);font-size:16px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.sec h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--gold);transform:rotate(45deg)}
.sec p,.sec ul{margin:0;color:var(--ink)}
.sec ul{padding-left:1.2em}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:4.5em 1fr 2.4em;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar .fl{height:100%;background:var(--night);border-radius:99px;transition:width .5s ease}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.lucky{display:flex;flex-wrap:wrap;gap:10px 20px;font-size:14px}
.lucky b{color:var(--muted);font-weight:500;margin-right:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line)}
/* match */
.match{border-top:1px dashed var(--line);padding-top:20px;display:grid;gap:12px}
.mrow{display:grid;grid-template-columns:1fr 110px;gap:8px}

.score .n{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;color:var(--blood);font-variant-numeric:tabular-nums}
.score .n small{font-size:16px;color:var(--muted)}
.score p{margin:0;font-size:14px}
.score strong{font-family:var(--display)}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:0}
.quote{margin:0;padding:18px 20px;border-radius:12px;background:var(--night);color:var(--paper);display:grid;gap:8px;position:relative;overflow:hidden}

.quote blockquote{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(18px,4.4vw,22px);line-height:1.6;text-wrap:balance}
.qact{display:flex;gap:8px}

.tabs{display:flex;gap:4px;padding:0 22px;background:var(--soft);border-bottom:1px solid var(--line)}

.hero{border-bottom:0}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:10px}

.seg button[aria-selected=true]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ovr{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{--v:70;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;align-content:center;background:radial-gradient(closest-side,var(--paper) 78%,transparent 79%),conic-gradient(var(--blood) calc(var(--v)*1%),var(--soft) 0)}

.stars{color:var(--gold);letter-spacing:2px}

.wd{display:grid;gap:4px;justify-items:center;font-size:12px;color:var(--muted)}

.mo span{aspect-ratio:1;max-width:100%;display:grid;place-items:center;border-radius:6px;font-size:12px;font-variant-numeric:tabular-nums}
.c.l0{background:var(--night);color:var(--paper)}.c.l1{background:var(--soft);color:var(--ink)}.c.l2{background:transparent;border:1px dashed var(--line);color:var(--muted)}

.legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.legend .c{width:12px;height:12px;border-radius:3px;display:inline-block;margin-left:6px}
@media (prefers-reduced-motion:reduce){.bar .fl{transition:none}}
</style>

function signOf(m,d){
  const order=["capricorn","aquarius","pisces","aries","taurus","gemini","cancer","leo","virgo","libra","scorpio","sagittarius","capricorn"];
  const cut=[20,19,21,20,21,22,23,23,23,24,23,22]; // 每月星座交界日

const DAYMS=864e5;
function hash(str){let h=2166136261;for(const c of str){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// 月亮所在星座（簡化公式，誤差約 1–2 度）
function moonIdx(dt){const d=(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate(),12)-Date.UTC(2000,0,1,12))/DAYMS;
  const L=218.316+13.176396*d,M=(134.963+13.064993*d)*Math.PI/180;return Math.floor((((L+6.289*Math.sin(M))%360)+360)%360/30)}
const HARM={same:8,good:6,bad:-6,meh:-3};
function elRel(a,b){if(a===b)return"same";const g={fire:"air",air:"fire",earth:"water",water:"earth"};if(g[a]===b)return"good";
  if((a==="fire"&&b==="water")||(a==="water"&&b==="fire")||(a==="earth"&&b==="air")||(a==="air"&&b==="earth"))return"bad";return"meh"}
const ymd=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
function dayScore(s,blood,dt){const r=rng(hash(s.k+blood+ymd(dt)));const mi=moonIdx(dt);let v=58+r()*28+HARM[elRel(s.el,SIGNS[mi].el)];
  if(SIGNS[mi].k===s.k)v+=6;return Math.round(Math.max(38,Math.min(98,v)))}

function periodDays(p){const t=new Date();t.setHours(12,0,0,0);
  if(p==="today")return[t];
  if(p==="tomorrow")return[new Date(t.getTime()+DAYMS)];
  if(p==="week"){const off=(t.getDay()+6)%7;const m=new Date(t.getTime()-off*DAYMS);return[...Array(7)].map((_,i)=>new Date(m.getTime()+i*DAYMS))}
  const y=t.getFullYear(),mo=t.getMonth(),n=new Date(y,mo+1,0).getDate();return[...Array(n)].map((_,i)=>new Date(y,mo,i+1,12))}

 water:["水象的你，感受多是因為心很柔軟，這是一種力量。","照顧別人之前，先抱抱自己。","情緒來了就讓它流過，不用急著趕走。","你的溫柔像水，能慢慢滋養身邊的一切。"]};
let qOff=0;
function dailyQuote(s,d){const pool=[...QUOTES,...QEL[s.el],...QEL[s.el]];const i=(hash(ymd(d)+s.k+"q")+qOff)%pool.length;return pool[i]}
function quoteHTML(s){const d=new Date(),q=dailyQuote(s,d);
  return `<figure class="quote"><figcaption>${d.getMonth()+1} 月 ${d.getDate()} 日 · 給${s.n}的一句話</figcaption><blockquote id="qtext">${q}</blockquote>
  <div class="qact"><button type="button" id="qnext">換一句</button><button type="button" id="qcopy">複製</button></div></figure>`}
function bindQuote(){const n=$("#qnext"),c=$("#qcopy");if(!n)return;
  n.onclick=()=>{qOff++;$("#qtext").textContent=dailyQuote(SIGNS.find(x=>x.k===st.sign),new Date())};
  c.onclick=()=>{const t=$("#qtext").textContent;const done=()=>{c.textContent="已複製";setTimeout(()=>c.textContent="複製",1500)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>sel())}else sel();
    function sel(){const r=document.createRange();r.selectNodeContents($("#qtext"));const s=getSelection();s.removeAllRanges();s.addRange(r)}}}

function fortuneHTML(s,blood){
  const p=st.per||"today", days=periodDays(p), scores=days.map(d=>dayScore(s,blood,d));
  const ov=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
  const key=p==="week"?"w"+ymd(days[0]):p==="month"?"m"+days[0].getFullYear()+"-"+days[0].getMonth():"d"+ymd(days[0]);
  const r=rng(hash(s.k+blood+key+"f"));const pick=a=>a[Math.floor(r()*a.length)];
  const L=lvl(ov);
  const cats=CATS.map(([k,n])=>{const v=Math.max(30,Math.min(99,Math.round(ov+(r()-.5)*34)));return{k,n,v,st:Math.max(1,Math.min(5,Math.round(v/20))),t:pick(POOL[k][lvl(v)])}});
  const yi=[...YI].sort(()=>r()-.5).slice(0,3), ji=[...JI].sort(()=>r()-.5).slice(0,2);
  const col=pick(COLORS), num=1+Math.floor(r()*9), dir=pick(DIRS), hr=pick(HOURS);
  const helper=SIGNS.filter(x=>elRel(s.el,x.el)==="good"||(x.el===s.el&&x.k!==s.k));const hp=helper[Math.floor(r()*helper.length)];
  const fmt=d=>`${d.getMonth()+1}/${d.getDate()}`;
  let sky="",chart="";
  if(p==="today"||p==="tomorrow"){const m=SIGNS[moonIdx(days[0])],rel=elRel(s.el,m.el);
    sky=`${fmt(days[0])}（${WD[days[0].getDay()]}）月亮行經 <b>${m.g} ${m.n}</b>，${m.k===s.k?"正好在你的星座，情緒與直覺都特別敏銳。":rel==="same"||rel==="good"?`與你同屬或相生的${EL[m.el].n}，氣場順。`:rel==="bad"?`${EL[m.el].n}與你的${EL[s.el].n}相沖，步調容易被打亂。`:"影響中性，照自己的節奏走就好。"}`;}
  else{const best=days.map((d,i)=>[d,scores[i]]).sort((a,b)=>b[1]-a[1]).slice(0,3).sort((a,b)=>a[0]-b[0]);
    const today=ymd(new Date());
    sky=p==="week"?`本週 ${fmt(days[0])}–${fmt(days[6])}，運勢最旺的日子是 <b>${best.map(b=>fmt(b[0])+"（"+WD[b[0].getDay()]+"）").join("、")}</b>。`
      :`${days[0].getMonth()+1} 月的好日子：<b>${best.map(b=>fmt(b[0])).join("、")}</b>，重要的事可以排在這幾天。`;
    chart=p==="week"
      ?`<div class="wk">${days.map((d,i)=>`<div class="wd${ymd(d)===today?" now":""}"><em>${scores[i]}</em><div class="col"><i style="height:${scores[i]}%"></i></div><span>${WD[d.getDay()]}</span></div>`).join("")}</div>`
      :`<div class="mo">${[...Array((days[0].getDay()+6)%7)].map(()=>"<span></span>").join("")}${days.map((d,i)=>`<span class="c l${lvl(scores[i])}${ymd(d)===today?" now":""}" title="${fmt(d)} ${scores[i]} 分">${d.getDate()}</span>`).join("")}</div>
        <div class="legend"><span class="c l0"></span>旺 <span class="c l1"></span>平 <span class="c l2"></span>低</div>`;}
  const pers=[["today","今日"],["tomorrow","明日"],["week","本週"],["month","本月"]];
  return `<div class="body">
    <div class="seg" role="tablist" id="per">${pers.map(([k,n])=>`<button type="button" role="tab" id="per-${k}" data-p="${k}" aria-selected="${k===p}">${n}</button>`).join("")}</div>
    ${quoteHTML(s)}
    <div class="ovr"><div class="ring" style="--v:${ov}"><b>${ov}</b><small>綜合</small></div>
      <div style="min-width:0"><p class="sky">${sky}</p><p class="lead">${pick(POOL.all[L])}</p></div></div>
    ${chart}
    <div class="cats">${cats.map(c=>`<div class="cat"><div class="ch"><b>${c.n}</b><span class="stars" aria-label="${c.st} 顆星">${stars(c.st)}</span></div><p>${c.t}</p></div>`).join("")}</div>
    <div class="grid2">
      <div class="sec"><h3>宜</h3><div class="tags yi">${yi.map(x=>`<span>${x}</span>`).join("")}</div></div>
      <div class="sec"><h3>忌</h3><div class="tags ji">${ji.map(x=>`<span>${x}</span>`).join("")}</div></div>
    </div>
    <div class="lucky"><span><b>幸運色</b><span class="sw" style="background:${col[1]}"></span>${col[0]}</span><span><b>幸運數字</b>${num}</span><span><b>吉方</b>${dir}</span><span><b>好時段</b>${hr}</span><span><b>貴人</b>${hp.g} ${hp.n}</span></div>
    <div class="sec"><h3>血型加持</h3><p>${BFT[blood]}</p></div>
  </div>`;
}

function render(){
  const s=SIGNS.find(x=>x.k===st.sign), bl=BLOODS[st.blood];
  document.querySelectorAll("#signs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===st.sign));
  document.querySelectorAll("#bloods button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.b===st.blood));
  const stats=s.st.map((v,i)=>Math.max(15,Math.min(99,v+bl.mod[i])));
  const ps=SIGNS.find(x=>x.k===st.ps), pb=BLOODS[st.pb];
  let sc=ELM[s.el][ps.el]+BLM[st.blood][st.pb]; if(s.k===ps.k)sc-=3; sc=Math.max(40,Math.min(98,sc));
  const mt=matchText(sc,s,ps);
  const el=EL[s.el];
  const tabs=`<div class="tabs" role="tablist" id="tabs"><button type="button" role="tab" id="tab-luck" data-t="luck" aria-selected="${st.tab==="luck"}">星座運勢</button><button type="button" role="tab" id="tab-pers" data-t="pers" aria-selected="${st.tab==="pers"}">個性分析</button></div>`;
  $("#result").innerHTML=`
  <div class="hero">
    <div class="seal" aria-hidden="true"><b>${s.g}</b><i>${st.blood}</i></div>
    <div style="min-width:0">
      <div class="lbl">${s.n} · ${st.blood} 型</div>
      <h2>${s.adj}${bl.role}</h2>
      <div class="meta"><span class="chip el" style="background:${el.c}">${el.n}</span><span class="chip">守護星 ${s.p}</span><span class="chip">${s.d}</span></div>
    </div>
  </div>
`+tabs+(st.tab==="luck"?fortuneHTML(s,st.blood):`  <div class="body">
    <p class="lead">${s.core}${bl.add}</p>
    <div class="kws">${[...s.kw,...bl.d.split("、").slice(0,2)].map(k=>`<span>${k}</span>`).join("")}</div>
    <div class="sec"><h3>星座 × 血型 疊加</h3><p>${BLEND[s.el][st.blood]}</p></div>
    <div class="grid2">
      <div class="sec"><h3>個性優點</h3><ul>${s.str.map(x=>`<li>${x}</li>`).join("")}</ul></div>
      <div class="sec"><h3>需要留意</h3><ul>${s.weak.map(x=>`<li>${x}</li>`).join("")}</ul></div>
    </div>
    <div class="grid2">
      <div class="sec"><h3>感情</h3><p>${s.love}</p></div>
      <div class="sec"><h3>工作</h3><p>${s.work}</p></div>
    </div>
    <div class="sec"><h3>性格指數</h3>
      <div class="bars">${stats.map((v,i)=>`<div class="bar"><span>${STAT[i]}</span><div class="tr"><div class="fl" style="width:${v}%"></div></div><em>${v}</em></div>`).join("")}</div>
    </div>
    <div class="sec"><h3>給你的小提醒</h3><p>${bl.tip}</p></div>
    <div class="lucky"><span><b>幸運色</b><span class="sw" style="background:${s.lc[1]}"></span>${s.lc[0]}</span><span><b>幸運數字</b>${s.ln}</span><span><b>同元素星座</b>${SIGNS.filter(x=>x.el===s.el&&x.k!==s.k).map(x=>x.n).join("、")}</span></div>

    <div class="match">
      <div class="sec"><h3>和對方的契合度</h3></div>
      <div class="mrow">
        <select id="ps" aria-label="對方星座">${opts(st.ps)}</select>
        <select id="pb" aria-label="對方血型">${bopts(st.pb)}</select>
      </div>
      <div class="score"><div class="n">${sc}<small>%</small></div>
        <p><strong>${mt.t}</strong>　${mt.why}${st.blood}型${bl.role}遇上${st.pb}型${pb.role}，${BLM[st.blood][st.pb]>=6?"血型個性互補，相處省力。":BLM[st.blood][st.pb]<=0?"做事步調不同，多溝通就能減少摩擦。":"彼此理解起來不困難。"}</p>
      </div>
    </div>
  </div>`);
  $("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.tab=b.dataset.t;render()};
  if(st.tab==="luck"){$("#per").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.per=b.dataset.p;render()};bindQuote();save();return}

  $("#ps").onchange=e=>{st.ps=e.target.value;render()};
  $("#pb").onchange=e=>{st.pb=e.target.value;render()};
  save();
}
buildPickers();render();
</script>
<script>
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
